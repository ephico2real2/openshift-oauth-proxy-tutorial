# For a cluster administrator: the OAuth client ServiceAccount, created before the install.
# Use it when the chart must not create ServiceAccounts. Then install with:
#   --set serviceAccounts.oauthClient.create=false
#   --set serviceAccounts.oauthClient.name=<the name below>
#
# Change these three things to match your install:
#   metadata.name       the name you give in serviceAccounts.oauthClient.name
#   metadata.namespace  the namespace of the Helm release
#   reference.name      the Route name, which is the value "name" of the chart (default hello-nginx)
#
# The annotation makes the ServiceAccount an OAuth client. Without it, the OAuth server
# refuses the login. Give this ServiceAccount no RoleBinding: it does not need one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-oauth-proxy
  namespace: demo-rnd
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"hello-nginx"}}'
