# For a cluster administrator: the workload ServiceAccount of Option B, created before the
# install. Then install with:
#   --set serviceAccounts.workload.enabled=true
#   --set serviceAccounts.workload.create=false
#   --set serviceAccounts.workload.name=<the name below>
#
# It is not an OAuth client, so it has no redirect annotation.
# Give it the RoleBindings that the application needs. The demo page needs none.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-nginx
  namespace: demo-rnd
