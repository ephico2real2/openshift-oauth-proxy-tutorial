{{- /*
The session cookie key: the chart version of

  oc create secret generic <serviceAccountName>-cookie \
    --from-literal=session_secret="$(openssl rand -base64 32 | tr -d '\n')"

A Helm hook Job runs this on the cluster before install and before each upgrade. It creates
the Secret ONLY IF IT DOES NOT EXIST, so the key stays the same on each upgrade and the
users stay signed in. The key is never in the chart, in values or in the Helm release.

Why not randAlphaNum in a Secret template: Helm would make a new key at each upgrade and sign
every user out. Why not the `lookup` function: it returns nothing under `helm template`, so
Argo CD and other renderers would also make a new key at each sync.

The ServiceAccount, Role and RoleBinding of the Job are hooks too, with a lower weight, so
they exist before the Job starts. Helm does not delete the Secret at uninstall, because the
Job made it and not Helm. Delete it by hand, or delete the namespace.
Set cookieSecret.createWithJob to false to render none of this. Then a cluster administrator
creates the Secret before the install (see values.yaml).
*/ -}}
{{- if .Values.cookieSecret.createWithJob }}
{{- $secret := include "hello.cookieSecretName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $secret }}-job
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "hello.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
# The Job can read only the cookie Secret, and it can create Secrets.
# (Kubernetes cannot limit "create" to one name.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $secret }}-job
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "hello.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secret | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $secret }}-job
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "hello.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $secret }}-job
subjects:
  - kind: ServiceAccount
    name: {{ $secret }}-job
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $secret }}-job
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "hello.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: {{ $secret }}-job
      restartPolicy: Never
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
      containers:
        - name: create-cookie-secret
          image: {{ .Values.images.cli | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HOME
              value: /tmp
            - name: SECRET_NAME
              value: {{ $secret | quote }}
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # --ignore-not-found: "missing" prints nothing. Any other error stops the
              # Job with its message, and Kubernetes runs it again.
              existing="$(oc -n "$NAMESPACE" get secret "$SECRET_NAME" --ignore-not-found -o name)"
              if [ -n "$existing" ]; then
                echo "Secret $SECRET_NAME exists. It is kept."
                exit 0
              fi
              # 32 random bytes in base64, the same as: openssl rand -base64 32
              head -c 32 /dev/urandom | base64 | tr -d '\n' > /tmp/session_secret
              oc -n "$NAMESPACE" create secret generic "$SECRET_NAME" \
                --from-file=session_secret=/tmp/session_secret
              rm -f /tmp/session_secret
              echo "Secret $SECRET_NAME created."
{{- end }}
