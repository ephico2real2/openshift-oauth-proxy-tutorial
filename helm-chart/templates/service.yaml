# The serving-cert annotation tells the service-ca operator to issue a certificate for
# <name>.<namespace>.svc into the Secret <name>-tls, and to rotate it.
# The Service sends traffic to the proxy port. nginx is not reachable through the Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "hello.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ .Values.name }}-tls
spec:
  selector:
    app: {{ .Values.name | quote }}
  ports:
    - name: https
      port: 443
      targetPort: oauth-proxy
