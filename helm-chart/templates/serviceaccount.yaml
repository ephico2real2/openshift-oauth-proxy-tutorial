{{- $sa := .Values.serviceAccounts }}
{{- if and $sa.workload.enabled (eq $sa.workload.name $sa.oauthClient.name) }}
{{- fail "serviceAccounts.workload.name must not be the same as serviceAccounts.oauthClient.name: Option B needs two ServiceAccounts." }}
{{- end }}
{{- if $sa.oauthClient.create }}
# The OAuth client of the proxy. The redirect annotation makes this ServiceAccount an
# OAuth client, so no OAuthClient object is necessary. It names the Route, and the OAuth
# server accepts a callback URL on the host that the Route status reports.
# This ServiceAccount gets no RoleBinding. The access check runs with the token of the user.
# Not rendered when serviceAccounts.oauthClient.create is false: then a cluster administrator
# creates it from examples/serviceaccount-oauth-client.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.oauthClient.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "hello.labels" . | nindent 4 }}
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ .Values.name }}"}}'
{{- end }}
{{- if and $sa.workload.enabled $sa.workload.create }}
---
# Option B: the workload identity. Give it the RBAC that the application needs.
# It is not an OAuth client: it has no redirect annotation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.workload.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "hello.labels" . | nindent 4 }}
{{- end }}
{{- if $sa.workload.enabled }}
---
# Option B: a long-lived token of the OAuth client ServiceAccount. The token controller
# fills data.token, and the proxy uses it as the client secret. Delete it to revoke it.
# The chart creates it also when the ServiceAccount is an existing one.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sa.oauthClient.name }}-token
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "hello.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ $sa.oauthClient.name | quote }}
type: kubernetes.io/service-account-token
{{- end }}
