# The dedicated ServiceAccount that is the OAuth client of the proxy.
# The redirect-reference annotation makes this ServiceAccount an OAuth client, so no
# OAuthClient object is necessary. It names the Route "hello-nginx", and the OAuth server
# accepts any callback URL on the host that the Route status reports.
# This ServiceAccount has no RoleBinding. The proxy does not need API permissions for
# -openshift-sar, because the access review runs with the token of the user that logs in.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-oauth-proxy
  namespace: demo-rnd
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"hello-nginx"}}'
