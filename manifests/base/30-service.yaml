# The serving-cert annotation tells the service-ca operator to issue a certificate for
# hello-nginx.demo-rnd.svc into the Secret hello-nginx-tls, and to rotate it.
# The Service targets the proxy port. nginx is not reachable through the Service.
apiVersion: v1
kind: Service
metadata:
  name: hello-nginx
  namespace: demo-rnd
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: hello-nginx-tls
spec:
  selector:
    app: hello-nginx
  ports:
    - name: https
      port: 443
      targetPort: oauth-proxy
