# Namespace members: everyone in the group demo-rnd-members gets "view" in demo-rnd, and
# "view" includes get on Services, so the -openshift-sar check passes for them.
# Bind a group, not single users, so that membership is managed in one place.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-rnd-members-view
  namespace: demo-rnd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: demo-rnd-members
