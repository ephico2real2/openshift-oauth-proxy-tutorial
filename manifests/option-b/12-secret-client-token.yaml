# A long-lived token for the OAuth client ServiceAccount hello-oauth-proxy. The token
# controller fills data.token. The OAuth server accepts it as the client secret of
# system:serviceaccount:demo-rnd:hello-oauth-proxy.
# This token does not expire. Delete the Secret to revoke it, and restart the pod
# after you create a new one, because the proxy reads the file once, at start.
apiVersion: v1
kind: Secret
metadata:
  name: hello-oauth-proxy-token
  namespace: demo-rnd
  annotations:
    kubernetes.io/service-account.name: hello-oauth-proxy
type: kubernetes.io/service-account-token
